<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DonBong Knowledge Base">
  <title>DonBong — Knowledge Library</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700;900&family=DM+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       TOKENS & THEMES
    ============================================================ */
    :root {
      --accent:     #ff5a00;
      --accent-lt:  #ff7a30;
      --accent-dk:  #cc3d00;
      --accent-rgb: 255,90,0;
      --gold:       #e8a320;
      --green:      #4caf50;
      --blue:       #5a8fff;
      
      /* Dark Theme */
      --ink:        #fff;
      --ink-80:     rgba(255,255,255,.85);
      --ink-60:     rgba(255,255,255,.60);
      --ink-30:     rgba(255,255,255,.30);
      --surface:    #050307;
      --line:       rgba(255,255,255,.10);
      --gbg:        rgba(255,255,255,.06);
      --gbg2:       rgba(255,255,255,.10);
      --gbl:        rgba(255,255,255,.16);
      
      --blur:       blur(22px) saturate(180%);
      --blur-sm:    blur(12px) saturate(150%);
      --pad-x:      24px;
      --nav-h:      72px;
      --max-w:      1320px;
      --r-sm:10px;--r-md:16px;--r-lg:24px;
      --ease: cubic-bezier(.22,1,0,1);
      --dur: .32s;
    }

    html[data-theme="light"] {
      --ink:        #111111;
      --ink-80:     rgba(0,0,0,.85);
      --ink-60:     rgba(0,0,0,.60);
      --ink-30:     rgba(0,0,0,.30);
      --surface:    #f9f9f9;
      --line:       rgba(0,0,0,.10);
      --gbg:        rgba(255,255,255,.8);
      --gbg2:       rgba(255,255,255,.95);
      --gbl:        rgba(0,0,0,.10);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; background: var(--surface); transition: background var(--dur) var(--ease); }
    /* Unified site font */
    body { font-family: 'Plus Jakarta Sans', 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: var(--surface); color: var(--ink); line-height: 1.6; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    h1,h2,h3 { font-family: 'Bebas Neue', 'Barlow Condensed', system-ui, sans-serif; }
    a { text-decoration: none; color: inherit; cursor: pointer; }
    button { font-family: inherit; cursor: pointer; }
    img { display: block; max-width: 100%; height: auto; }

    /* Grain */
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .016;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px;
    }

    .context-link { color: var(--accent); border-bottom: 1px solid rgba(var(--accent-rgb), .3); transition: all var(--dur) var(--ease); font-weight: 600; }
    .context-link:hover { border-color: var(--accent); color: var(--accent-lt); }

    /* ============================================================
       VIEWS & HERO
    ============================================================ */
    .view-section { display: none; animation: fadeIn 0.4s forwards; position: relative; z-index: 10; padding-top: var(--nav-h); }
    .view-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .lib-hero { padding: 72px var(--pad-x) 80px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .lib-hero::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 700px; height: 500px; background: radial-gradient(ellipse at 50% 0%, rgba(var(--accent-rgb),.18) 0%, transparent 70%); pointer-events: none; z-index: -1; }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: .72rem; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: var(--accent); margin-bottom: 18px; }
    .eyebrow::before { content:''; display:block; width:22px; height:1.5px; background:currentColor; border-radius:2px; }
    .lib-hero h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3.5rem, 7vw, 7.5rem); line-height: 1.05; letter-spacing: -.01em; margin-bottom: 20px; color: var(--ink); }
    .lib-hero h1 span { color: var(--accent); }
    .lib-hero p { max-width: 560px; color: var(--ink-60); font-size: 1.05rem; line-height: 1.75; margin-bottom: 40px; }

    .search-wrap { width: 100%; max-width: 540px; position: relative; margin-bottom: 56px; }
    .search-wrap input { width: 100%; background: var(--gbg); border: 1.5px solid var(--gbl); border-radius: 999px; padding: 14px 20px 14px 52px; color: var(--ink); font-size: .95rem; outline: none; backdrop-filter: var(--blur-sm); transition: all var(--dur) var(--ease); }
    .search-wrap input:focus { border-color: rgba(var(--accent-rgb),.5); background: var(--gbg2); }
    .search-wrap svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: none; stroke: var(--ink-30); stroke-width: 2; }

    .filter-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 64px; }
    .filter-pill { padding: 8px 20px; border-radius: 999px; background: var(--gbg); border: 1.5px solid var(--gbl); color: var(--ink-60); font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; backdrop-filter: var(--blur-sm); transition: all var(--dur) var(--ease); }
    .filter-pill:hover, .filter-pill.active { background: rgba(var(--accent-rgb),.15); border-color: var(--accent); color: var(--ink); }

    /* ============================================================
       ARTICLE GRID & COMPONENTS
    ============================================================ */
    .lib-grid { padding: 0 var(--pad-x) 100px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; max-width: var(--max-w); margin: 0 auto; }
    .art-card { position: relative; background: var(--gbg); border: 1px solid var(--gbl); border-radius: var(--r-lg); overflow: hidden; padding: 32px; display: flex; flex-direction: column; backdrop-filter: var(--blur); cursor: pointer; transition: all var(--dur) var(--ease); }
    .art-card:hover { transform: translateY(-8px); border-color: rgba(var(--accent-rgb),.45); background: var(--gbg2); box-shadow: 0 24px 60px rgba(0,0,0,.15), 0 0 0 1px rgba(var(--accent-rgb),.1); }
    .art-card.featured { grid-column: span 2; background: linear-gradient(135deg, rgba(var(--accent-rgb),.10) 0%, var(--gbg) 60%); border-color: rgba(var(--accent-rgb),.3); }
    .art-badge { position: absolute; top: 20px; right: 20px; background: var(--accent); color: #fff; font-size: .65rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; }
    .art-icon { font-size: 3rem; margin-bottom: 20px; line-height: 1; }
    .art-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
    .art-tag { padding: 4px 11px; border-radius: 999px; background: rgba(var(--accent-rgb),.1); border: 1px solid rgba(var(--accent-rgb),.25); font-size: .65rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
    .art-tag.blue  { background: rgba(90,143,255,.1); border-color: rgba(90,143,255,.3); color: var(--blue); }
    .art-tag.green { background: rgba(76,175,80,.1);  border-color: rgba(76,175,80,.3);  color: var(--green); }
    .art-tag.gold  { background: rgba(232,163,32,.1); border-color: rgba(232,163,32,.3); color: var(--gold); }
    .art-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.9rem; line-height: 1.1; margin-bottom: 12px; color: var(--ink); }
    .art-desc { font-size: .88rem; color: var(--ink-60); line-height: 1.7; margin-bottom: 24px; flex: 1; }
    .art-cta { display: inline-flex; align-items: center; gap: 8px; font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); border-bottom: 1.5px solid rgba(var(--accent-rgb),.3); padding-bottom: 2px; transition: all var(--dur) var(--ease); align-self: flex-start; }
    .art-card:hover .art-cta { gap: 14px; border-color: var(--accent); }

    /* ============================================================
       ARTICLE SPECIFIC CSS (MERGED FROM TXT FILES)
    ============================================================ */
    .article-inner { max-width: 960px; margin: 0 auto; padding: 36px var(--pad-x) 120px; }
    .article-h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3rem, 6vw, 6.5rem); line-height: 1.05; margin-bottom: 24px; color: var(--ink); }
    .article-lead { font-size: 1.15rem; color: var(--ink-60); line-height: 1.8; margin-bottom: 48px; max-width: 640px; border-left: 3px solid var(--accent); padding-left: 20px; }
    .article-section { margin-bottom: 56px; }
    .article-section h2 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 2rem; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 24px; color: var(--ink); }
    .article-section h2 span { color: var(--accent); }
    .article-section p { color: var(--ink-80); line-height: 1.8; margin-bottom: 16px; }
    
    /* Warning & Principle Boxes (from b2b/b2c) */
    .warning-box { background: linear-gradient(135deg, rgba(var(--accent-rgb),.05), var(--gbg)); border: 2px solid rgba(var(--accent-rgb),.5); border-radius: var(--r-md); padding: 32px 36px; margin: 32px 0; position: relative; backdrop-filter: var(--blur-sm); }
    .warning-box::before { content: '⚠️'; position: absolute; top: -20px; left: 30px; font-size: 28px; background: var(--surface); padding: 0 10px; border-radius: 8px; }
    .principle-box { background: var(--surface); border: 3px solid var(--accent); border-radius: var(--r-lg); padding: 48px; text-align: center; margin: 48px 0; box-shadow: 0 0 40px rgba(var(--accent-rgb), .15); }
    .principle-text { font-size: 1.3rem; font-weight: 700; color: var(--ink); margin: 16px 0; line-height: 1.5; }

    /* Media Grid (from master.txt) */
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin: 32px 0; }
    .media-card { background: var(--gbg); border: 1px solid var(--gbl); border-radius: var(--r-sm); overflow: hidden; cursor: pointer; transition: all var(--dur) var(--ease); display: flex; flex-direction: column; }
    .media-card:hover { border-color: var(--accent); transform: translateY(-6px); box-shadow: 0 15px 30px rgba(0,0,0,.2); }
    .media-card .img-wrap { position: relative; width: 100%; height: 200px; overflow: hidden; }
    .media-card img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.8); transition: filter var(--dur), transform var(--dur); }
    .media-card:hover img { filter: grayscale(0); transform: scale(1.05); }
    .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; background: rgba(var(--accent-rgb),.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; opacity: 0; transition: all var(--dur); }
    .media-card.video:hover .play-btn { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    .media-info { padding: 16px; flex: 1; }
    .media-title { font-family: 'Barlow Condensed', sans-serif; font-size: 1.2rem; font-weight: 700; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; display: block; }
    .media-desc { font-size: .85rem; color: var(--ink-60); line-height: 1.5; }

    /* FAQ & Compare Tool (from perc.txt) */
    .faq-item { background: var(--gbg); border: 1px solid var(--gbl); border-radius: var(--r-md); padding: 20px 24px; margin-bottom: 12px; cursor: pointer; transition: all var(--dur) var(--ease); }
    .faq-item:hover { border-color: var(--accent); background: var(--gbg2); }
    .faq-question { font-weight: 700; font-size: 1.05rem; color: var(--ink); display: flex; justify-content: space-between; align-items: center; }
    .faq-question::after { content: '+'; color: var(--accent); font-size: 1.5rem; transition: transform 0.3s; }
    .faq-item.active-faq .faq-question::after { transform: rotate(45deg); }
    .faq-answer { display: none; margin-top: 12px; color: var(--ink-60); line-height: 1.6; border-top: 1px solid var(--line); padding-top: 12px; }
    .faq-item.active-faq .faq-answer { display: block; animation: fadeIn 0.3s; }

    .compare-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .compare-btn { padding: 8px 16px; border-radius: 999px; background: var(--gbg); border: 1px solid var(--gbl); color: var(--ink-60); font-weight: 600; font-size: .8rem; cursor: pointer; transition: all 0.2s; }
    .compare-btn.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
    .comparison-table { width: 100%; border-collapse: collapse; background: var(--gbg); border-radius: var(--r-md); overflow: hidden; margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,.1); border: 1px solid var(--gbl); }
    .comparison-table th, .comparison-table td { padding: 16px 20px; border-bottom: 1px solid var(--gbl); text-align: left; color: var(--ink); font-size: .9rem; }
    .comparison-table th { background: rgba(var(--accent-rgb), 0.1); font-weight: 700; font-family: 'Barlow Condensed', sans-serif; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }
    .comparison-table tr:last-child td { border-bottom: none; }

    /* Blueprint SVG Container (from device.txt) */
    .blueprint-wrapper { display: grid; grid-template-columns: 280px 1fr 300px; gap: 24px; background: var(--gbg); border: 1px solid var(--gbl); border-radius: var(--r-lg); padding: 24px; margin: 40px 0; align-items: center; }
    @media(max-width: 1100px) { .blueprint-wrapper { grid-template-columns: 1fr; } }
    .schematic-svg { width: 100%; max-height: 600px; display: block; margin: 0 auto; filter: drop-shadow(0 0 20px rgba(var(--accent-rgb), 0.1)); }
    .glass-outer { fill: none; stroke: var(--ink); stroke-width: 4; }
    .glass-inner { fill: none; stroke: var(--accent); stroke-width: 2.5; }
    .glass-fill { fill: rgba(var(--accent-rgb), 0.15); stroke: var(--accent); stroke-width: 1; }
    .perc-detail { stroke: var(--accent); stroke-width: 1.5; }
    .dimension-line { stroke: var(--ink-60); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .dimension-text, .label-text { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink); }
    .component-marker { fill: var(--accent); stroke: var(--ink); stroke-width: 2; }
    
    .spec-panel, .dimensions-panel { background: var(--surface); padding: 24px; border-radius: var(--r-md); border: 1px solid var(--gbl); height: 100%; }
    .spec-panel h3, .dimensions-panel h3 { font-family: 'Barlow Condensed', sans-serif; color: var(--accent); font-size: 1.3rem; margin-bottom: 16px; text-transform: uppercase; border-bottom: 1px solid var(--gbl); padding-bottom: 8px; }
    .spec-item { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--gbl); padding: 12px 0; font-size: .85rem; transition: transform 0.2s; cursor: default; }
    .spec-item:hover { transform: translateX(5px); color: var(--accent); }
    .dim-input-group { margin-bottom: 16px; }
    .dim-input-group label { display: block; font-size: .75rem; font-weight: 700; color: var(--ink-60); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    .dim-input-group input { width: 100%; background: var(--gbg); border: 1px solid var(--gbl); color: var(--ink); padding: 10px 12px; border-radius: var(--r-sm); font-family: inherit; font-size: .9rem; transition: border-color 0.2s; }
    .dim-input-group input:focus { outline: none; border-color: var(--accent); }

    /* Level Cards & Tabs */
    .level-cards { display: flex; flex-direction: column; gap: 16px; margin: 28px 0; }
    .level-card { background: var(--gbg); border: 1px solid var(--gbl); border-radius: var(--r-md); padding: 24px 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px; backdrop-filter: var(--blur-sm); }
    .level-card .lv-num { font-size: .7rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-60); margin-bottom: 4px; }
    .level-card .lv-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1.4rem; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); }
    .level-card .lv-pct { font-size: 2.8rem; font-weight: 900; color: var(--accent); line-height: 1; flex-shrink: 0; }
    .tabs-bar { display: flex; gap: 4px; margin-bottom: 24px; flex-wrap: wrap; }
    .tab-btn { padding: 9px 18px; border-radius: var(--r-sm); background: var(--gbg); border: 1px solid var(--gbl); color: var(--ink-60); font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; transition: all var(--dur); }
    .tab-btn.active, .tab-btn:hover { background: rgba(var(--accent-rgb),.15); border-color: var(--accent); color: var(--ink); }
    .tab-panel { display: none; animation: fadeIn .3s forwards; }
    .tab-panel.active { display: block; }

    .btn-primary { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff !important; padding: 13px 28px; border-radius: var(--r-sm); font-size: .82rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; transition: all var(--dur) var(--ease); border: none; }
    .btn-primary:hover { background: var(--accent-lt); transform: translateY(-3px); box-shadow: 0 10px 28px rgba(var(--accent-rgb),.35); }
    .article-cta { margin-top: 60px; padding: 48px 40px; background: linear-gradient(135deg, rgba(var(--accent-rgb),.12) 0%, var(--gbg) 100%); border: 1px solid rgba(var(--accent-rgb),.3); border-radius: var(--r-lg); text-align: center; }
  </style>
</head>
<body>

  <div id="global-header">
    <header class="global-topbar" role="banner">
      <a href="/" class="gb-logo" aria-label="DonBong Home">DON<span>BONG</span></a>
      <nav class="gb-nav" aria-label="Main">
        <a href="../" class="gb-link">Home</a>

        <a href="./" class="gb-link">Archive</a>
        <a href="../contacts/" class="gb-link">Contacts</a>
      </nav>
      <div class="gb-actions">
        <div class="search-wrap gb-search" role="search">

          </button>

        <button class="topbar-btn" id="cartOpenBtn"><i class="fas fa-shopping-bag"></i> <span id="cartLabel">Cart</span><span class="cart-total-label" id="cartTotalLabel"></span> <span class="badge-count" id="cartCount">0</span></button>
      </div>
      <style>
      .global-topbar{position:sticky;top:0;z-index:1100;display:flex;align-items:center;gap:12px;padding:10px 18px;background:rgba(5,3,7,.88);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.04)}
      .gb-logo{font-weight:800;font-family:Plus Jakarta Sans, sans-serif;color:#fff;text-decoration:none}
      .gb-logo span{color:#ff6b00}
      .gb-nav{display:flex;gap:8px;align-items:center;margin-left:12px}
      .gb-link{color:rgba(255,255,255,.9);padding:8px 12px;border-radius:12px;text-decoration:none;font-weight:700}
      .gb-link:hover{background:rgba(255,255,255,.02)}

      @media(max-width:820px){.gb-nav{display:none}.gb-search input{width:120px}}
      </style>
  </div>

  <div id="listView" class="view-section active">
    <div class="lib-hero">
      <div class="eyebrow" data-i18n="lib_eyebrow">Knowledge Base</div>
      <h1 data-i18n="lib_title">DonBong<br><span>Library</span></h1>
      <p data-i18n="lib_subtitle">Master your craft. The definitive guides to glass architecture, culture, and care.</p>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" data-i18n-ph="search" placeholder="Search articles…" autocomplete="off">

        search: "Поиск статей…", tag_all: "Все", back: "Библиотека"
      },
      vi: {
        lib_eyebrow: "Thư viện kiến thức",
        lib_title: "Don Bong<br><span>Thư viện</span>",
        lib_subtitle: "Làm chủ kỹ năng. Hướng dẫn toàn diện về kiến trúc thủy tinh, văn hóa và chăm sóc.",
        search: "Tìm bài viết…",
        tag_all: "Tất cả",
        back: "Thư viện"
      }
    };

    // ============================================================
    // CONTROLLER
    // ============================================================
    class LibraryController {
      constructor() {
        this.currentTag = 'All';
        this.searchQuery = '';
        this.currentLang = 'en';
        this.init();
      }

      init() {
        this.setupBus();
        this.setupListeners();
        this.updateLanguage(this.currentLang);
        this.handleRoute();
      }

      setupBus() {
        window.addEventListener('message', (e) => {
          if(!e.data) return;
          if(e.data.type === 'themeChanged') document.documentElement.setAttribute('data-theme', e.data.theme);
          if(e.data.type === 'languageChanged') this.updateLanguage(e.data.lang);
        });
      }

      updateLanguage(lang) {
        if(!I18N[lang]) lang = 'en';
        this.currentLang = lang;
        const dict = I18N[lang];
        document.querySelectorAll('[data-i18n]').forEach(el => el.innerHTML = dict[el.getAttribute('data-i18n')]);
        document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = dict[el.getAttribute('data-i18n-ph')]);
      }

      setupListeners() {
        window.addEventListener('hashchange', () => this.handleRoute());

        document.body.addEventListener('click', (e) => {
          const link = e.target.closest('[data-navigate]');
          if(link) {
            e.preventDefault();
            if(window.parent !== window) window.parent.postMessage({ type: 'navigate', path: link.dataset.navigate }, '*');
          }
          
          const tabBtn = e.target.closest('.tab-btn');
          if(tabBtn && tabBtn.dataset.tab) {
            const container = tabBtn.closest('.article-section');
            container.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            container.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            tabBtn.classList.add('active');
            container.querySelector('#' + tabBtn.dataset.tab).classList.add('active');
          }
        });

        document.querySelectorAll('.filter-pill').forEach(btn => {
          btn.addEventListener('click', (e) => {
            document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            this.currentTag = e.target.dataset.tag;
            this.renderList();
          });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
          this.searchQuery = (e.target.value || '').toLowerCase().trim();
          this.renderList();
        });
      }

      switchView(viewId) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        window.scrollTo({top: 0, behavior: 'smooth'});
      }

      handleRoute() {
        const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
        if(!hash) { this.showList(); } 
        else { this.showArticle(hash.replace('article/', '')); }
      }

      renderList() {
        const grid = document.getElementById('articleGrid');
        let filtered = ARTICLES;
        if(this.currentTag !== 'All') filtered = filtered.filter(a => a.tags.includes(this.currentTag.toLowerCase()));
        if(this.searchQuery) filtered = filtered.filter(a => a.title.toLowerCase().includes(this.searchQuery) || a.summary.toLowerCase().includes(this.searchQuery));

        filtered.sort((a, b) => a.featured === b.featured ? 0 : a.featured ? -1 : 1);

        grid.innerHTML = filtered.length ? filtered.map((a, i) => `
          <div class="art-card ${a.featured ? 'featured' : ''}" style="animation-delay: ${i*0.06}s" onclick="window.location.hash = '#/article/${a.id}'">
            ${a.badge ? \`<div class="art-badge">\${a.badge}</div>\` : ''}
            <div class="art-icon">\${a.icon}</div>
            <div class="art-tags">\${a.tagLabels.map(([label, cls]) => \`<span class="art-tag \${cls}">\${label}</span>\`).join('')}</div>
            <div class="art-title">\${a.title}<br><span style="color:var(--ink-60);font-size:.8em;">\${a.subtitle}</span></div>
            <p class="art-desc">\${a.summary}</p>
            <div class="art-cta">Read Article <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
          </div>
        `).join('') : '<div style="grid-column:1/-1;text-align:center;color:var(--ink-30);">No articles found.</div>';
      }

      showList() { this.switchView('listView'); this.renderList(); }

      showArticle(id) {
        const article = ARTICLES.find(a => a.id === id);
        if(!article || !BODIES[id]) return window.location.hash = '#/';
        this.switchView('articleView');
        document.getElementById('bcTitle').innerText = article.title;
        document.getElementById('article-content').innerHTML = BODIES[id]();
        if(id === 'perc') window.renderCompare(); // Initialize comparison tool for Perc article
      }
    }

    const libController = new LibraryController();
  </script>
  <script>
  // load shared header/mobtab/bg
  (function(){var s=document.createElement('script');s.defer=true;s.src='/_shared_layout.js';document.body.appendChild(s);})();
  </script>
</body>
