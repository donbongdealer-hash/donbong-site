<div class="container" style="padding-top:140px;">
  <div class="hero-shop">
    <h1 class="h1">Premium <span style="color:var(--accent);">Shop</span></h1>
    <p class="section-sub">Curated selection of premium bongs, pipes, grinders.</p>
  </div>
  <div class="shop-controls">
    <select id="categoryFilter" class="fi" style="padding: 10px 16px; width: auto;"><option value="">All Categories</option></select>
    <select id="brandFilter" class="fi" style="padding: 10px 16px; width: auto;"><option value="">All Brands</option></select>
    <select id="sortSelect" class="fi" style="padding: 10px 16px; width: auto;"><option value="name">Name</option><option value="price-asc">Price ↑</option><option value="price-desc">Price ↓</option></select>
    <span style="padding: 10px 16px; color: var(--text-secondary);"><span id="productCount">0</span> products</span>
  </div>
  <div id="productsGrid" class="pgrid"></div>
  <div id="pagination" style="display:flex; justify-content:center; gap:8px; margin-top:40px;"></div>
</div>
