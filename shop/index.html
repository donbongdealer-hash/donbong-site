/* ══════════════════════════════════════════════════
SESSION & TRACKING
══════════════════════════════════════════════════ */
function getSid() { let s=sessionStorage.getItem('dbSid'); if(!s){s=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2));sessionStorage.setItem('dbSid',s);} return s; }
function getUTM() { const p=new URLSearchParams(window.location.search); return{utm_source:p.get('utm_source')||sessionStorage.getItem('utm_source')||'direct',utm_medium:p.get('utm_medium')||'',utm_campaign:p.get('utm_campaign')||''}; }
const utm = getUTM();
Object.entries(utm).forEach(([k,v])=>v&&sessionStorage.setItem(k,v));
function track(action, extra = {}) {
if (USE_MOCK || !GAS_URL.includes('script.google.com')) return;

const payload = {
action: 'track',
event: action,
sessionId: getSid(),
referrer: document.referrer,
...utm,
extra
};

if (navigator.sendBeacon) {
const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
navigator.sendBeacon(GAS_URL, blob);
} else {
fetch(GAS_URL, {
method: 'POST',
mode: 'cors',
cache: 'no-cache',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload),
keepalive: true
}).catch(() => {});
}
}

function observeCards(){
const obs=new IntersectionObserver((entries)=>{ entries.forEach((e,i)=>{ if(e.isIntersecting){const el=e.target;el.style.animationDelay=(i*.055)+'s';el.classList.add('card-enter');obs.unobserve(el);} }); },{threshold:.08});
document.querySelectorAll('.card-wrap,.smart-block').forEach(el=>obs.observe(el));
}

/* ══════════════════════════════════════════════════
DATA ENRICHMENT
══════════════════════════════════════════════════ */
function enrich(p,i){
const sq=parseInt(p.stockqty ?? p.stockQty)||0;
const inStock=(p.inStock===true||p.inStock==='true'||p.inStock==='ИСТИНА'||sq>0);
const disc=(p.oldPrice>p.price&&p.oldPrice>0)?Math.round(((p.oldPrice-p.price)/p.oldPrice)*100):0;
let material='other',nl=(p.name||'').toLowerCase();
if(nl.includes('glass')||nl.includes('crystal')||nl.includes('borosil')) material='borosilicate';
else if(nl.includes('acrylic')) material='acrylic';
else if(nl.includes('metal')||nl.includes('zinc')||nl.includes('alumin')) material='metal';
else if(nl.includes('silicone')) material='silicone';
let imgs=[];
if(p.imageUrl) imgs.push(...p.imageUrl.split(',').map(u=>fixImg(u.trim())));
if(p.gallery) imgs.push(...p.gallery.split(',').map(u=>fixImg(u.trim())));
if(!imgs.length) imgs.push('https://placehold.co/400x600/0a0a12/ff6b00?text=DB');
const cat=p.category||'Accessories';
const catL=cat.toLowerCase();
const catKey=catL.includes('bong')?'bongs':catL.includes('pipe')?'pipes':catL.includes('vapor')?'vaporizers':catL.includes('grind')?'grinders':catL.includes('stor')?'storage':catL.includes('offer')?'offers':catL.includes('gear')?'gear':'accessories';
const pReviews=reviews[String(p.id||i)]||[];
const avgRating=pReviews.length?pReviews.reduce((s,r)=>s+r.rating,0)/pReviews.length:0;
return{
id:String(p.id||i),name:p.name||'Product',category:cat,catKey,brand:p.brand||'Don Bong',
price:parseFloat(p.price)||0,oldPrice:parseFloat(p.oldPrice)||0,description:p.description||'',
inStock,discount:disc,isNew:(parseInt(p.id)>400),isTop:(parseFloat(p.price)>1500000),
material,imgs,rating:avgRating,popularity:parseInt(p.popularity)||Math.floor(Math.random()*100)+20,
createdAt:Date.now()
};
}

const afActions=[];
function updateActiveFilters(){
const chips=[];
if(filters.catKey!=='all') chips.push({label:filters.catKey,rm:()=>{filters.catKey='all';buildCatStripActive();applyFilters();}});
filters.subCat.forEach(s=>chips.push({label:s,rm:()=>{filters.subCat=filters.subCat.filter(v=>v!==s);buildCatStripActive();applyFilters();}}));
if(filters.material) chips.push({label:filters.material,rm:()=>{document.getElementById('materialFilter').value='';filters.material='';applyFilters();}});
if(filters.brand) chips.push({label:filters.brand,rm:()=>{document.getElementById('brandFilter').value='';filters.brand='';applyFilters();}});
if(filters.wishlistMode) chips.push({label:t('wishlist'),rm:()=>{filters.wishlistMode=false;document.getElementById('wlBtn').classList.remove('wl-active');applyFilters();}});
const bar=document.getElementById('activeFilters');
if(!bar) return;
if(!chips.length){ bar.classList.remove('visible'); return; }
bar.classList.add('visible');
afActions.length=0;
chips.forEach(c=>afActions.push(c.rm));
bar.innerHTML=`<span class="af-label">Filters:</span>`+chips.map((c,i)=>`<div class="af-chip" onclick="afActions[${i}]()"><i class="fas fa-times"></i> ${esc(c.label)}</div>`).join('');
}

/* ══════════════════════════════════════════════════
APPLY FILTERS
══════════════════════════════════════════════════ */
function applyFilters(){
const q=(document.getElementById('searchInput')?.value||'').toLowerCase().trim();
	filters.stock =document.getElementById('stockFilter')?.value||'all';
filters.material =document.getElementById('materialFilter')?.value||'';
filters.brand =document.getElementById('brandFilter')?.value||'';
filters.priceMin =parseInt(document.getElementById('priceMin')?.value)||0;
filters.priceMax =parseInt(document.getElementById('priceMax')?.value)||10000000;
filters.sort =document.getElementById('sortSelect')?.value||'default';
filtered=all.filter(p=>{
if(filters.stock==='instock'&&!p.inStock) return false;
if(filters.catKey!=='all'&&p.catKey!==filters.catKey) return false;
if(filters.subCat.length&&!filters.subCat.some(s=>p.name.toLowerCase().includes(s.toLowerCase()))) return false;
if(filters.material&&p.material!==filters.material) return false;
if(filters.brand&&p.brand!==filters.brand) return false;
if(p.price<filters.priceMin||p.price>filters.priceMax) return false;
if(q&&!p.name.toLowerCase().includes(q)&&!p.description.toLowerCase().includes(q)&&!p.brand.toLowerCase().includes(q)) return false;
if(filters.wishlistMode&&!wishlist.includes(p.id)) return false;
return true;
});
if(filters.sort==='price_asc') filtered.sort((a,b)=>a.price-b.price);
else if(filters.sort==='price_desc') filtered.sort((a,b)=>b.price-a.price);
else if(filters.sort==='popular') filtered.sort((a,b)=>b.popularity-a.popularity);
else if(filters.sort==='newest') filtered.sort((a,b)=>b.createdAt-a.createdAt);
else filtered.sort((a,b)=>a.name.localeCompare(b.name));
page=1;
updateActiveFilters();
renderSmartGrid();
renderPagination();
updateCatCounts();
}

function renderPagination(){
const total=Math.ceil(filtered.length/PAGE_SIZE), pag=document.getElementById('pagination');
if(total<=1){pag.innerHTML='';return;}
let pages=[];
if(total<=7){for(let i=1;i<=total;i++) pages.push(i);}
else{
pages=[1,2];
if(page>4) pages.push('…');
for(let i=Math.max(3,page-1);i<=Math.min(total-2,page+1);i++) pages.push(i);
if(page<total-3) pages.push('…');
pages.push(total-1,total);
}
let html=`<button class="pg-btn" onclick="goToPage(${Math.max(1,page-1)})" ${page===1?'disabled':''}><i class="fas fa-chevron-left"></i></button>`;
pages.forEach(p=>{html+=p==='…'?`<button class="pg-btn pg-dot">…</button>`:`<button class="pg-btn ${p===page?'active':''}" onclick="goToPage(${p})">${p}</button>`;});
html+=`<button class="pg-btn" onclick="goToPage(${Math.min(total,page+1)})" ${page===total?'disabled':''}><i class="fas fa-chevron-right"></i></button>`;
pag.innerHTML=html;
}

async function submitOrderViaDB(orderData) {
if (window.DB && typeof window.DB.createOrder === 'function') {
return await window.DB.createOrder(orderData);
} else {
try {
const response = await fetch(DB.API_URL, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ action: 'createOrder', payload: orderData })
});
const result = await response.json();
if (result && result.success) return result;
else throw new Error(result.error || 'Order failed');
} catch (error) {
console.error('Order submission error:', error);
throw error;
}
}
}

async function placeOrder() {

const name = nameEl?.value.trim();
const contact = contactEl?.value.trim();
const address = addrEl?.value.trim();

const contactRegex = /^[a-zA-Z0-9@._+\-\s]{3,50}$/;
const errors = [];
if (!name) errors.push(nameEl);
if (!contact || !contactRegex.test(contact)) errors.push(contactEl);
if (!address) errors.push(addrEl);

if (errors.length) {
errors.forEach(el => { if (el) { el.style.borderColor = '#ef4444'; el.addEventListener('input', () => el.style.borderColor = '', { once: true }); } });
showToast(`<i class="fas fa-exclamation-circle"></i> ${t('fillFields')}`, 'error');
errors[0]?.focus();
return;
}

const btn = document.getElementById('placeOrderBtn');
const originalText = btn.innerHTML;
btn.disabled = true;
btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t('placeOrder') + '...';

const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
const delivery = subtotal >= FREE_SHIP ? 0 : SHIP_COST;
const total = subtotal + delivery;
const orderNum = 'DB' + Date.now().toString().slice(-6);

const orderPayload = {
orderNum, name, contact, address,
items: cart.map(item => ({ id: item.id, name: item.name, price: item.price, qty: item.qty, priceFormatted: fmt(item.price) })),
total: total, totalFormatted: fmt(total), currency: 'VND'
};

try {
try { await submitOrderViaDB(orderPayload); } catch (dbError) { console.warn('DB order submission failed:', dbError); }

let telegramResponse;
let telegramRaw = '';
try {
telegramResponse = await fetch('https://www.donbong.com/_functions/telegramOrder', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(orderPayload)
});
if (!telegramResponse.ok) {
telegramRaw = await telegramResponse.text().catch(() => 'no body');
throw new Error(`Backend error: ${telegramResponse.status}`);
}
await telegramResponse.json();
} catch (error) {
console.error('Telegram notification failed:', error.message);
throw error;
}

cart = []; saveCart(); updateCounters(); track('purchase', { orderNum, total }); closeInfo();

document.getElementById('confirmCard').innerHTML = `

/* ══════════════════════════════════════════════════
PRODUCT MODAL (with navigation)
══════════════════════════════════════════════════ */
function openProduct(id){
const p=all.find(x=>x.id===id); if(!p) return;
track('productView',{product:p.name});
currentProductIndex = filtered.findIndex(x=>x.id===id);
hasPrev = currentProductIndex > 0;
hasNext = currentProductIndex < filtered.length-1;
const pReviews=reviews[p.id]||[], avgR=pReviews.length?pReviews.reduce((s,r)=>s+r.rating,0)/pReviews.length:0;
const catColor=getCatColor(p.catKey);
const related=all.filter(x=>x.catKey===p.catKey&&x.id!==p.id&&x.inStock).slice(0,5);
const accessories=all.filter(x=>x.catKey==='accessories'&&x.inStock).slice(0,3);
const galleryThumbs = p.imgs.length>1 ? p.imgs.map((img,i)=>`<div class="m-thumb ${i===0?'active':''}" onclick="switchMImg('${esc(img)}',this, ${i})"><img src="${esc(img)}" onerror="imgFb(this)"></div>`).join('') : '';
const reviewsHtml=pReviews.map(r=>`
<div class="review-item">
<div class="review-header">
<div class="review-avatar">${esc(r.author.charAt(0).toUpperCase())}</div>
<span class="review-author">${esc(r.author)}</span>
<span class="review-stars">${starsHtml(r.rating,'11px')}</span>
<span class="review-date">${r.date?new Date(r.date).toLocaleDateString():''}</span>
</div>
<div class="review-text">${esc(r.text)}</div>
</div>`).join('');

const catArticleMap = {
bongs: { slug: 'bongs', label: 'Bong Selection Guide' },
pipes: { slug: 'choice', label: 'How to Choose a Device' },
vaporizers: { slug: 'device', label: 'Device Blueprint' },
grinders: { slug: 'choice', label: 'Selection Guide' },
accessories: { slug: 'hygiene', label: 'Glass Care Guide' },
};
const artLink = catArticleMap[p.catKey];
const libraryBlock = artLink ? `
<div class="m-section-title"><i class="fas fa-book-open" style="color:var(--fire);font-size:10px;"></i>&nbsp;Read in Library</div>
<a href="https://www.donbong.com/library#/${artLink.slug}" target="_top" style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--glass);border:1px solid var(--rim);border-radius:14px;font-size:12px;color:var(--text-mid);text-decoration:none;transition:.2s;" onmouseenter="this.style.borderColor='var(--fire)';this.style.color='var(--fire)'" onmouseleave="this.style.borderColor='var(--rim)';this.style.color='var(--text-mid)'"><i class="fas fa-arrow-right" style="font-size:10px;"></i>${artLink.label}</a>` : '';

document.getElementById('prodModalContent').innerHTML=`
<button class="m-close" onclick="closeModal()" aria-label="${t('close')}"><i class="fas fa-times"></i></button>
${hasPrev ? '<div class="m-prod-nav m-prod-nav-prev" onclick="navigateProduct(-1)" title="Previous product"><i class="fas fa-chevron-left"></i></div>' : ''}
${hasNext ? '<div class="m-prod-nav m-prod-nav-next" onclick="navigateProduct(1)" title="Next product"><i class="fas fa-chevron-right"></i></div>' : ''}
<div class="m-left">
<div class="m-img-wrap" id="mImgWrap">
<img class="m-img" id="mMainImg" src="${esc(p.imgs[0])}" alt="${esc(p.name)}" onerror="imgFb(this)" decoding="async">
</div>
${p.imgs.length>1 ? `<div class="m-gallery-strip" id="mGalleryStrip">${galleryThumbs}</div>` : ''}
</div>
<div class="m-right">
<div class="m-cat" style="color:${catColor}">${esc(p.category)}</div>
<h2>${esc(p.name)}</h2>
<div class="m-price-row"><div class="m-price">${fmt(p.price)}</div>${p.oldPrice>p.price?`<div class="m-old-price">${fmt(p.oldPrice)}</div>`:''}${p.discount>0?`<div class="bdg bdg-sale" style="align-self:center">−${p.discount}%</div>`:''}</div>
<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
<div class="m-stock ${p.inStock?'in':'out'}"><i class="fas fa-${p.inStock?'circle-check':'circle-xmark'}"></i> ${p.inStock?t('inStockLabel'):t('outStock')}</div>
<div style="display:flex;align-items:center;gap:4px">${starsHtml(avgR,'14px')}<span style="font-size:11px;color:var(--text-dim);font-family:var(--mono)">(${pReviews.length} ${t('rating')})</span></div>
</div>
${p.description?`<div class="m-desc">${esc(p.description)}</div>`:''}
<div class="m-tags">
${p.material&&p.material!=='other'?`<span class="m-tag"><i class="fas fa-cube"></i> ${p.material}</span>`:''}
${p.brand?`<span class="m-tag"><i class="fas fa-tag"></i> ${esc(p.brand)}</span>`:''}
${p.isNew?`<span class="m-tag" style="border-color:var(--fire);color:var(--fire)">NEW 2025</span>`:''}
${p.isTop?`<span class="m-tag" style="border-color:#c8a96e;color:#c8a96e">TOP</span>`:''}
</div>
${libraryBlock}
${related.length?`<div><div class="m-section-title"><i class="fas fa-sparkles" style="color:var(--fire)"></i> ${t('youMayLike')}</div><div class="cross-grid">${related.map(r=>`<div class="cross-card" data-id="${r.id}" onclick="openProduct('${r.id}')"><img src="${esc(r.imgs[0])}" alt="" onerror="imgFb(this)"><div class="cc-name">${esc(r.name)}</div><div class="cc-price">${fmt(r.price)}</div></div>`).join('')}</div></div>`:''}
${accessories.length?`<div><div class="m-section-title"><i class="fas fa-gift" style="color:var(--fire)"></i> ${t('completeSet')}</div><div class="bundle-items">${accessories.map(a=>`<div class="bundle-add" onclick="addToCart('${a.id}');showToast('Added','success')">+ ${esc(a.name.slice(0,20))} (${fmt(a.price)})</div>`).join('')}</div></div>`:''}
<div class="reviews-section">
<div class="m-section-title"><i class="fas fa-star" style="color:#facc15"></i> Reviews</div>
<div id="mReviewList">${reviewsHtml||`<p style="color:var(--text-dim);font-size:12px;padding:8px 0">No reviews yet. Be the first!</p>`}</div>
<button class="write-review-btn" onclick="openReviewForm('${p.id}')"><i class="fas fa-pen"></i> ${t('writeReview')}</button>
</div>
<div class="m-actions">
<button class="btn-primary" onclick="addToCart('${p.id}');closeModal()"><i class="fas fa-cart-plus"></i> Add to Cart</button>
<button class="btn-secondary" onclick="copyShareLink('${p.id}')"><i class="fas fa-share-alt"></i> Share</button>
</div>
</div>`;
window._currentProductImages = p.imgs;
window._currentImageIndex = 0;
const mImg = document.getElementById('mMainImg');
if(mImg){ mImg.classList.add('img-loading'); mImg.onload=()=>mImg.classList.remove('img-loading'); }
document.getElementById('prodModal').classList.add('active');
document.body.style.overflow='hidden';
}

function navigateProduct(direction){
if(currentProductIndex===-1) return;
const newIndex = currentProductIndex + direction;
if(newIndex>=0 && newIndex<filtered.length) openProduct(filtered[newIndex].id);
}
function switchMImg(src, el, idx){
const main=document.getElementById('mMainImg'); if(!main) return;
if(main.src === src) return;
main.style.opacity='0';
setTimeout(()=>{main.src=src;main.style.opacity='1';},200);
document.querySelectorAll('.m-thumb').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
if(idx !== undefined) window._currentImageIndex = idx;
}
function closeModal(){
document.getElementById('prodModal').classList.remove('active');
document.body.style.overflow='';
}
function handleModalBdrop(e){ if(e.target===document.getElementById('prodModal')) closeModal(); }

/* ══════════════════════════════════════════════════
REVIEW FORM
══════════════════════════════════════════════════ */
function openReviewForm(pid){
reviewRating=5;
document.getElementById('reviewContent').innerHTML=`
<div class="info-title"><i class="fas fa-pen"></i> ${t('writeReview')}</div>
<div style="margin-bottom:12px"><label style="font-size:11px;color:var(--text-dim);display:block;margin-bottom:6px">Rating</label><div class="star-picker" id="starPicker">${[1,2,3,4,5].map(i=>`<span class="sp-star active" data-v="${i}" onclick="setRevRating(${i})">★</span>`).join('')}</div></div>
<input class="form-input" id="revAuthor" placeholder="Your name">
<textarea class="form-input textarea" id="revText" placeholder="${t('yourReview')}"></textarea>
<button class="btn-primary" id="submitRevBtn"><i class="fas fa-paper-plane"></i> ${t('submit')}</button>
<div class="modal-link-close"><button onclick="closeReviewModal()">${t('close')}</button></div>`;
document.getElementById('submitRevBtn').addEventListener('click',()=>submitReview(pid));
document.getElementById('reviewModal').classList.add('active');
}
function setRevRating(val){
reviewRating=val;
document.querySelectorAll('.sp-star').forEach(s=>s.classList.toggle('active',parseInt(s.dataset.v)<=val));
}
function submitReview(pid){
const text = document.getElementById('revText')?.value.trim();
const author = document.getElementById('revAuthor')?.value.trim() || 'Guest';
if (!text) { showToast(`<i class="fas fa-exclamation-circle"></i> Please write a review`, 'error'); return; }
if (!reviews[pid]) reviews[pid] = [];
reviews[pid].push({ author, rating: reviewRating, text, date: new Date().toISOString() });
localStorage.setItem('db_reviews', JSON.stringify(reviews));
closeReviewModal();
showToast(`<i class="fas fa-check-circle"></i> ${t('reviewThanks')}`, 'success');
openProduct(pid);
}
function closeReviewModal(){ document.getElementById('reviewModal').classList.remove('active'); }
function handleReviewBdrop(e){ if(e.target===document.getElementById('reviewModal')) closeReviewModal(); }

/* ══════════════════════════════════════════════════
SHARE & OFFER
══════════════════════════════════════════════════ */
function copyShareLink(id){
const url = window.location.origin + window.location.pathname + '?product=' + encodeURIComponent(id);
if(navigator.clipboard && window.isSecureContext){
navigator.clipboard.writeText(url).then(()=>showToast(`<i class="fas fa-link"></i> ${t('linkCopied')}`,'success')).catch(()=>fallbackCopyLink(url));
} else { fallbackCopyLink(url); }
}
function fallbackCopyLink(url){
const inp = document.createElement('input'); inp.value = url; inp.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
document.body.appendChild(inp); inp.focus(); inp.select();
try{ document.execCommand('copy'); showToast(`<i class="fas fa-link"></i> ${t('linkCopied')}`,'success'); }
catch(e){ showToast(`<i class="fas fa-link"></i> URL: ${url}`,'info'); }
document.body.removeChild(inp);
}
window.applyOffer = () => {
const DISCOUNT = 0.8;
all.forEach(p => { if (p.catKey === 'accessories' && !p._offerActive) { p._origPrice = p.price; p.price = parseFloat((p.price * DISCOUNT).toFixed(2)); p._offerActive = true; } });
filters.catKey = 'accessories'; buildCatStripActive(); applyFilters();
showToast('🔥 −20% on accessories activated!', 'success');
};

/* ══════════════════════════════════════════════════
TOAST SYSTEM
══════════════════════════════════════════════════ */
function showToast(html,type='default'){
const backBtn = document.querySelector('.back-to-top'); if(backBtn) backBtn.style.opacity = '0';
const stack=document.getElementById('toastStack'); const el=document.createElement('div');
el.className=`toast toast-${type}`; el.innerHTML=html; stack.appendChild(el);
setTimeout(()=>{ el.style.animation='toastOut .3s var(--ease) forwards'; setTimeout(()=>{ el.remove(); if(!stack.children.length && backBtn) backBtn.style.opacity = ''; },300); },2800);
}

/* ══════════════════════════════════════════════════
LANGUAGE
══════════════════════════════════════════════════ */
function updateLangFlag(){ const btn=document.getElementById('langBtn'); if(btn) btn.className=`lang-btn flag-${currentLang}`; }
function switchLang(){
const order=['en','ru','vi']; currentLang=order[(order.indexOf(currentLang)+1)%order.length];
localStorage.setItem('db_lang',currentLang); document.documentElement.lang = currentLang;
updateLangFlag(); applyLang(); applyFilters();
}
function applyLang(){
const si=document.getElementById('searchInput'); if(si) si.placeholder=t('search');
const wl=document.getElementById('wlLabel'); if(wl) wl.innerText=t('wishlist');
const cl=document.getElementById('cartLabel'); if(cl) cl.innerText=t('cart');
const ct=document.getElementById('cartPanelTitle'); if(ct) ct.innerText=t('cart');
}

/* ══════════════════════════════════════════════════
STICKY OFFSETS
══════════════════════════════════════════════════ */
function updateStickyOffsets(){
const tb = document.querySelector('.topbar'); const cs = document.querySelector('.cat-strip');
if(!tb || !cs) return; const tbH = tb.offsetHeight;
document.documentElement.style.setProperty('--header-h', tbH+'px'); cs.style.top = tbH + 'px';
const fb = document.querySelector('.filter-bar'); if(fb && window.getComputedStyle(fb).position === 'sticky') fb.style.top = (tbH + cs.offsetHeight) + 'px';
}

/* ══════════════════════════════════════════════════
STORAGE SYNC
══════════════════════════════════════════════════ */
window.addEventListener('storage', e=>{
if(e.key === 'db_cart'){ cart = JSON.parse(e.newValue || '[]'); updateCounters(); if(document.getElementById('cartPanel').classList.contains('active')) renderCart(); }
if(e.key === 'db_wishlist'){ wishlist = JSON.parse(e.newValue || '[]'); updateCounters(); document.querySelectorAll('[data-id]').forEach(el=>{ const pid = el.dataset.id; if(pid) el.classList.toggle('liked', wishlist.includes(pid)); }); }
if(e.key === 'db_lang'){ currentLang = e.newValue || 'en'; updateLangFlag(); applyLang(); }
});

/* ══════════════════════════════════════════════════
KEYBOARD SHORTCUTS
══════════════════════════════════════════════════ */
document.addEventListener('keydown',e=>{
if(e.key==='Escape'){ [closeModal, closeCart, closeInfo, closeReviewModal, closeConfirm].forEach(fn=>{ if(typeof fn === 'function') fn(); }); }
if((e.ctrlKey||e.metaKey)&&e.key==='k'){ e.preventDefault(); document.getElementById('searchInput')?.focus(); }
if(document.getElementById('prodModal')?.classList.contains('active')){
if(e.key === 'ArrowLeft') { e.preventDefault(); if(hasPrev) navigateProduct(-1); }
if(e.key === 'ArrowRight'){ e.preventDefault(); if(hasNext) navigateProduct(1); }
}
});

/* ══════════════════════════════════════════════════
INIT
══════════════════════════════════════════════════ */
document.getElementById('langBtn').addEventListener('click',switchLang);
document.getElementById('langBtn').addEventListener('keydown',e=>e.key==='Enter'&&switchLang());
document.getElementById('searchInput').addEventListener('input',e=>onSearchInput(e.target.value));
document.getElementById('searchClearBtn').addEventListener('click',clearSearch);
const priceMinEl = document.getElementById('priceMin'); if(priceMinEl) priceMinEl.addEventListener('input', ()=>{ filters.priceMin = parseFloat(priceMinEl.value)||0; applyFilters(); });
const priceMaxEl = document.getElementById('priceMax'); if(priceMaxEl) priceMaxEl.addEventListener('input', ()=>{ filters.priceMax = parseFloat(priceMaxEl.value)||10000000; applyFilters(); });

async function init(){
buildCatStrip(); updateLangFlag(); document.documentElement.lang = currentLang; applyLang();
document.getElementById('smartGrid').innerHTML = Array(9).fill('<div class="skeleton"></div>').join('');

try {
	// Try multiple sources: window.DB.API_URL (if configured), WORKER_URL, then local candidates
	// Prefer local dev candidates first, then gateway
	const candidates = [];
	candidates.push(...LOCAL_API_CANDIDATES);
	candidates.push(WORKER_URL + (WORKER_URL.includes('?') ? '' : '?action=getCatalog'));
	// If a DB API base is provided, try replacing common endpoints to form a catalog URL
	if (window.DB && window.DB.API_URL) {
		try {
			const base = window.DB.API_URL.replace(/\/orders\/?$/i, '');
			candidates.push(base + '/getCatalog');
		} catch (err) {}
	}

	let data = null;
	let lastErr = null;
	for (const url of candidates) {
		try {
			const response = await fetch(url, { cache: 'no-store' });
			if (!response.ok) throw new Error(`HTTP ${response.status} @ ${url}`);
			data = await response.json();
			console.log('Catalog loaded from', url);
			break;
		} catch (err) {
			lastErr = err;
			console.warn('Catalog load failed from', url, err);
			continue;
		}
	}

	if (!data) throw lastErr || new Error('No catalog source available');
	const products = Array.isArray(data) ? data : (data.items || data.products || []);
	all = products.map((p, i) => enrich(p, i));

} catch (e) {
console.warn('Ошибка загрузки каталога, использую fallback', e);
all = [
{ id:'8', name:'Silver Rifle Bong', category:'Bongs & Bubblers', price:1499000, oldPrice:2500000, inStock:false, description:'Premium glass bong', imageUrl:'https://drive.google.com/uc?export=view&id=1pkRoy_sxo3A1gZFDzZwvPthuQvo0zfou', gallery:'' },
{ id:'14', name:'Gravity bong', category:'Bongs & Bubblers', price:999000, oldPrice:1100000, inStock:true, description:'Gravity bong', imageUrl:'https://drive.google.com/uc?export=view&id=1C6NdVUfvXcl9dhMX6pxJFxFkfs2NzVY3', gallery:'' }
].map((p, i) => enrich(p, i));
}

const totalV = all.length, catsV = new Set(all.map(p => p.catKey)).size, stockV = all.filter(p => p.inStock).length;
const elTotal = document.getElementById('statTotal'), elCats = document.getElementById('statCats'), elStock = document.getElementById('statStock');
if(elTotal) countUp(elTotal, totalV, 1200); if(elCats) countUp(elCats, catsV, 900); if(elStock) countUp(elStock, stockV, 1400);

const brands = [...new Set(all.map(p => p.brand).filter(Boolean))].sort();
const bf = document.getElementById('brandFilter');
if(bf){
	brands.forEach(b => { const o = document.createElement('option'); o.value = b; o.text = b; bf.appendChild(o); });
}

applyFilters(); updateCounters(); updateCartTotalLabel();
if(typeof track === 'function'){ try{ track('visit', { page: window.location.href }); } catch(e){} }
updateStickyOffsets(); window.addEventListener('resize', updateStickyOffsets);

const pid = new URLSearchParams(window.location.search).get('product'); if(pid) setTimeout(() => openProduct(pid), 600);
const catParam = new URLSearchParams(window.location.search).get('cat');
if(catParam) { const normalised = catParam.toLowerCase().trim(); const validCats = ['bongs','pipes','vaporizers','grinders','accessories','storage','offers','gear']; if(validCats.includes(normalised)) { setTimeout(() => { filters.catKey = normalised; buildCatStripActive(); applyFilters(); const grid = document.getElementById('smartGrid'); if(grid) grid.scrollIntoView({ behavior:'smooth', block:'start' }); }, 500); } }
}

init();
</script>
